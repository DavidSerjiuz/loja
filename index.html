<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja - Câmera Integrada</title>
    <!-- Importando a inteligência de leitura de código de barras -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* Mantemos o mesmo estilo acessível da versão anterior */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #2c3e50; color: white; padding: 10px; text-align: center; }
        nav { display: flex; justify-content: center; background-color: #34495e; }
        nav button { background-color: inherit; color: white; border: none; padding: 15px; cursor: pointer; font-size: 18px; font-weight: bold;}
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 5px; }
        .active { display: block; }
        input { padding: 15px; margin: 10px 0; width: 100%; box-sizing: border-box; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 18px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 15px; text-align: left; }
        
        .btn { padding: 15px; margin: 5px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; color: white; width: 100%; }
        .btn-verde { background-color: #27ae60; }
        .btn-vermelho { background-color: #e74c3c; }
        .btn-azul { background-color: #2980b9; }
        
        #reader { width: 100%; margin-top: 10px; display: none; } /* Esconde a câmera inicialmente */
    </style>
</head>
<body>

<header><h1>Caixa Rápido</h1></header>

<nav>
    <button onclick="openTab('caixa')">🛒 CAIXA</button>
    <button onclick="openTab('estoque')">📦 ESTOQUE</button>
</nav>

<div class="container">
    <!-- CAIXA -->
    <div id="caixa" class="tab-content active">
        <button class="btn btn-azul" onclick="iniciarCamera()" style="font-size: 24px; padding: 20px;">📷 ABRIR CÂMERA</button>
        <div id="reader"></div> <!-- A imagem da câmera aparece aqui -->

        <input type="text" id="codigoVenda" placeholder="Ou digite o código aqui..." onkeypress="verificarEnter(event)">
        
        <table id="tabelaCarrinho">
            <thead><tr><th>Produto</th><th>Valor Un.</th><th>Total</th></tr></thead>
            <tbody></tbody>
        </table>
        <h2 style="color: #27ae60;">TOTAL: R$ <span id="totalVendaDisplay">0.00</span></h2>
        
        <button class="btn btn-verde" onclick="alert('Sistema de pagamento em breve!')">✅ FINALIZAR VENDA</button>
    </div>

    <!-- ESTOQUE (Simplificado para o teste) -->
    <div id="estoque" class="tab-content">
        <h2>Cadastrar Produto Teste</h2>
        <input type="text" id="cadCodigo" placeholder="Código de Barras">
        <input type="text" id="cadNome" placeholder="Nome do Produto">
        <input type="number" id="cadPreco" placeholder="Preço (R$)" step="0.01">
        <button class="btn btn-verde" onclick="salvarProduto()">Salvar Produto</button>
    </div>
</div>

<script>
    let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
    let html5QrcodeScanner;

    function openTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
    }

    function salvarProduto() {
        let prod = { 
            codigo: document.getElementById('cadCodigo').value, 
            nome: document.getElementById('cadNome').value, 
            preco: parseFloat(document.getElementById('cadPreco').value) 
        };
        produtos.push(prod);
        localStorage.setItem('produtos', JSON.stringify(produtos));
        alert("Salvo!");
    }

    function adicionarAoCarrinho(codigoLido) {
        let produto = produtos.find(p => p.codigo === codigoLido);
        if(produto) {
            let tbody = document.querySelector('#tabelaCarrinho tbody');
            tbody.innerHTML += `<tr><td>${produto.nome}</td><td>R$ ${produto.preco}</td><td>R$ ${produto.preco}</td></tr>`;
            alert("✅ " + produto.nome + " adicionado!");
        } else {
            alert("❌ Produto não encontrado no estoque.");
        }
    }

    function verificarEnter(event) {
        if (event.key === "Enter") {
            adicionarAoCarrinho(document.getElementById('codigoVenda').value);
            document.getElementById('codigoVenda').value = '';
        }
    }

    // --- LÓGICA DA CÂMERA ---
    function iniciarCamera() {
        document.getElementById('reader').style.display = "block"; // Mostra o quadro
        
        // Configura o leitor
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150} }, false);
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Quando a câmera consegue ler um código com sucesso
        console.log(`Código lido: ${decodedText}`);
        
        // Pára a câmera para não ler duas vezes sem querer
        html5QrcodeScanner.clear(); 
        document.getElementById('reader').style.display = "none";
        
        // Joga o produto no carrinho
        adicionarAoCarrinho(decodedText);
    }

    function onScanFailure(error) {
        // Ignora erros normais de quando a câmera ainda está focando
    }
</script>

</body>
</html>
