<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja - Câmera Direta</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #2c3e50; color: white; padding: 10px; text-align: center; }
        nav { display: flex; justify-content: center; background-color: #34495e; }
        nav button { background-color: inherit; color: white; border: none; padding: 15px; cursor: pointer; font-size: 18px; font-weight: bold;}
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 5px; }
        .active { display: block; }
        input { padding: 15px; margin: 10px 0; width: 100%; box-sizing: border-box; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 18px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 15px; text-align: left; }
        .btn { padding: 15px; margin: 5px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; color: white; width: 100%; }
        .btn-verde { background-color: #27ae60; }
        .btn-vermelho { background-color: #e74c3c; }
        .btn-azul { background-color: #2980b9; }
        .btn-amarelo { background-color: #f39c12; }
        
        /* Estilo da Câmera em Tela Cheia */
        .camera-overlay { display: none; flex-direction: column; background: black; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; justify-content: center; align-items: center; }
        #reader { width: 90%; max-width: 500px; border-radius: 10px; overflow: hidden; }
        .fechar-camera { position: absolute; top: 20px; right: 20px; font-size: 30px; background: red; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; cursor: pointer; font-weight: bold; }
        /* Novos estilos para o Caixa */
        .foto-produto { width: 50px; height: 50px; background-color: #ddd; display: inline-flex; justify-content: center; align-items: center; border-radius: 5px; font-size: 24px; }
        .input-qtd { width: 60px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #ccc; border-radius: 5px; padding: 5px; margin: 0 5px; }
        .btn-remover { background-color: #e74c3c; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .rodape-caixa { background-color: #ecf0f1; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .btn-pgto-caixa { font-size: 20px; padding: 20px; width: 31%; border-radius: 10px; cursor: pointer; border: none; color: white; font-weight: bold; margin-bottom: 10px; }
       .recibo { text-align: left; background: #fff; padding: 15px; border: 1px dashed #333; font-family: monospace; font-size: 16px; margin-top: 15px; }

        /* Faz os Modais (Pop-ups) ficarem escondidos até serem chamados */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 30px; border: 1px solid #888; width: 90%; max-width: 600px; border-radius: 10px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header><h1>Sistema de Caixa</h1></header>

<nav>
    <button onclick="openTab('caixa')">🛒 CAIXA</button>
    <button onclick="abrirVendasDoDia()">🧾 ÚLTIMAS VENDAS</button>
</nav>

<div class="container">
    <!-- ABA CAIXA (VENDAS) -->
    <div id="caixa" class="tab-content active">
        <button class="btn btn-azul" onclick="iniciarCamera()" style="font-size: 24px; padding: 20px; margin-bottom: 15px;">📷 LER CÓDIGO (VENDER)</button>
        <input type="text" id="codigoVenda" placeholder="Ou digite o código aqui..." onkeypress="verificarEnter(event)">
        
        <table id="tabelaCarrinho" style="border: none;">
            <tbody id="listaCarrinho"></tbody>
        </table>

        <div class="rodape-caixa">
            <h2 style="color: #27ae60; font-size: 30px; margin: 0 0 5px 0;">Valor total R$ <span id="totalVendaDisplay">0.00</span></h2>
            <p style="font-size: 20px; font-weight: bold; margin: 0 0 20px 0; color: #7f8c8d;"><span id="qtdItensDisplay">0</span> Itens na sacola</p>
            
            <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
                <button class="btn-pgto-caixa bg-pix" onclick="iniciarPagamento('PIX')">💠 PIX</button>
                <button class="btn-pgto-caixa bg-dinheiro" onclick="iniciarPagamento('DINHEIRO')">💵 DINHEIRO</button>
                <button class="btn-pgto-caixa bg-cartao" onclick="iniciarPagamento('CARTÃO')">💳 CARTÃO</button>
            </div>
            
            <button class="btn btn-vermelho" onclick="cancelarVenda()" style="margin-top: 15px; font-size: 18px;">❌ CANCELAR VENDA</button>
        </div>
    </div>
</div>
<!-- TELA DA CÂMERA (Fica escondida até clicar no botão) -->
<div id="telaCamera" class="camera-overlay">
    <button class="fechar-camera" onclick="fecharCamera()">X</button>
    <div id="reader"></div>
    <h2 style="color: white; margin-top: 20px;">Aponte para o código...</h2>
</div>
<div id="modalDinheiro" class="modal">
    <div class="modal-content">
        <h2>Dinheiro Recebido 💵</h2>
        <p style="font-size: 24px;">Total da Compra: <b>R$ <span id="totalDinheiro">0.00</span></b></p>
        <input type="number" id="valorRecebido" placeholder="Digite o valor recebido (R$)" step="0.01" oninput="calcularTroco()" style="font-size: 24px; text-align: center;">
        <p style="font-size: 28px; color: #27ae60; font-weight: bold;">Troco: R$ <span id="valorTroco">0.00</span></p>
        
        <div style="display: flex; justify-content: space-around; margin-top: 30px;">
            <button class="btn-gigante btn-vermelho" onclick="fecharModais()" style="font-size: 24px; padding: 20px;">❌ CORRIGIR</button>
            <button class="btn-gigante btn-verde" onclick="abrirConfirmacao('DINHEIRO')" style="font-size: 24px; padding: 20px;" id="btnAvancarDinheiro" disabled>✅ AVANÇAR</button>
        </div>
    </div>
</div>

<!-- MODAL: CONFIRMAÇÃO FINAL -->
<div id="modalConfirmacao" class="modal">
    <div class="modal-content">
        <h2>Finalizar compra?</h2>
        <p style="font-size: 22px;">Pagamento via: <b id="formaPagamentoDisplay"></b></p>
        <div style="display: flex; justify-content: space-around; margin-top: 30px;">
            <button class="btn-gigante btn-vermelho" onclick="fecharModais()" style="font-size: 24px; padding: 20px;">❌ CORRIGIR</button>
            <button class="btn-gigante btn-verde" onclick="finalizarVenda()" style="font-size: 24px; padding: 20px;">✅ SIM</button>
        </div>
    </div>
</div>

<!-- MODAL: RECIBO DE SUCESSO -->
<div id="modalVendasDia" class="modal">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
        <h2>🧾 Vendas de Hoje</h2>
        <ul id="listaVendasHoje" style="text-align: left; font-size: 18px; padding: 0;"></ul>
        <button class="btn btn-vermelho" onclick="fecharModais()" style="margin-top: 20px; font-size: 20px; padding: 15px; width: 100%;">❌ FECHAR</button>
    </div>
</div>


<script>
    // Carrega o banco de dados
    let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
    let vendas = JSON.parse(localStorage.getItem('vendas')) || [];
    let carrinho = [];
    let formaPagamentoAtual = "";
    let html5QrCode;

    function openTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        let aba = document.getElementById(tabName);
        if(aba) aba.classList.add('active');
    }

    // --- CÂMERA DO CAIXA ---
    function iniciarCamera() {
        document.getElementById('telaCamera').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, onScanSuccess
        ).catch(err => { alert("Erro ao abrir a câmera."); fecharCamera(); });
    }
    function fecharCamera() {
        if (html5QrCode) html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.log(err));
        document.getElementById('telaCamera').style.display = 'none';
        document.getElementById('codigoVenda').focus();
    }
    function onScanSuccess(decodedText) {
        fecharCamera();
        adicionarAoCarrinho(decodedText);
    }

    // --- CARRINHO E VENDAS ---
    function adicionarAoCarrinho(codigo) {
        produtos = JSON.parse(localStorage.getItem('produtos')) || []; 
        let produto = produtos.find(p => p.codigo === codigo);
        
        if(produto) {
            let item = carrinho.find(i => i.produto.codigo === codigo);
            if (item) item.quantidade += 1;
            else carrinho.push({ produto: produto, quantidade: 1 });
            atualizarCarrinho();
        } else {
            alert("❌ Produto não cadastrado no sistema!");
        }
        document.getElementById('codigoVenda').focus();
    }
    
    function verificarEnter(event) { if (event.key === "Enter") { adicionarAoCarrinho(document.getElementById('codigoVenda').value); document.getElementById('codigoVenda').value = ''; } }
    
    function alterarQuantidade(index, valor) {
        carrinho[index].quantidade += valor;
        if(carrinho[index].quantidade <= 0) carrinho.splice(index, 1);
        atualizarCarrinho();
    }

    function digitarQuantidade(index, input) {
        let novaQtd = parseInt(input.value);
        if (novaQtd > 0) carrinho[index].quantidade = novaQtd;
        else carrinho.splice(index, 1);
        atualizarCarrinho();
    }

    function removerItem(index) {
        carrinho.splice(index, 1);
        atualizarCarrinho();
    }
    
    function atualizarCarrinho() {
        let tbody = document.getElementById('listaCarrinho');
        tbody.innerHTML = ''; 
        let total = 0; let totalItens = 0;

        carrinho.forEach((item, index) => {
            let subtotal = item.produto.preco * item.quantidade;
            total += subtotal; totalItens += item.quantidade;
            tbody.innerHTML += `
            <tr style="border-bottom: 1px solid #ddd;">
                <td style="padding: 10px 5px; width: 60px;"><div class="foto-produto">📦</div></td>
                <td style="font-weight:bold; font-size: 18px;">${item.produto.nome}<br><span style="color: #7f8c8d; font-size: 14px;">R$ ${item.produto.preco.toFixed(2)}</span></td>
                <td style="white-space: nowrap; text-align: center;">
                    <button class="btn-qtd" onclick="alterarQuantidade(${index}, -1)">-</button>
                    <input type="number" class="input-qtd" value="${item.quantidade}" onchange="digitarQuantidade(${index}, this)">
                    <button class="btn-qtd" onclick="alterarQuantidade(${index}, 1)">+</button>
                </td>
                <td style="font-weight:bold; color: #27ae60; font-size: 18px; text-align: right;">R$ ${subtotal.toFixed(2)}<br>
                <button class="btn-remover" onclick="removerItem(${index})" style="margin-top: 5px;">X</button></td>
            </tr>`;
        });
        document.getElementById('totalVendaDisplay').innerText = total.toFixed(2);
        document.getElementById('qtdItensDisplay').innerText = totalItens;
        document.getElementById('codigoVenda').focus();
    }
    
    function cancelarVenda() { carrinho = []; atualizarCarrinho(); document.getElementById('codigoVenda').focus(); }

    // --- PAGAMENTOS ---
    function iniciarPagamento(forma) {
        if(carrinho.length === 0) return alert("❌ Carrinho vazio!");
        formaPagamentoAtual = forma;
        
        if(forma === 'DINHEIRO') {
            let total = carrinho.reduce((acc, item) => acc + (item.produto.preco * item.quantidade), 0);
            document.getElementById('totalDinheiro').innerText = total.toFixed(2);
            document.getElementById('valorRecebido').value = '';
            document.getElementById('valorTroco').innerText = "0.00";
            document.getElementById('btnAvancarDinheiro').disabled = true;
            document.getElementById('modalDinheiro').style.display = "block";
            setTimeout(() => document.getElementById('valorRecebido').focus(), 100);
        } else {
            abrirConfirmacao(forma);
        }
    }

    function calcularTroco() {
        let total = carrinho.reduce((acc, item) => acc + (item.produto.preco * item.quantidade), 0);
        let recebido = parseFloat(document.getElementById('valorRecebido').value) || 0;
        let troco = recebido - total;
        let btnAvancar = document.getElementById('btnAvancarDinheiro');

        if (troco >= 0 && recebido > 0) {
            document.getElementById('valorTroco').innerText = troco.toFixed(2);
            document.getElementById('valorTroco').style.color = "#27ae60";
            btnAvancar.disabled = false;
        } else {
            document.getElementById('valorTroco').innerText = "Falta valor!";
            document.getElementById('valorTroco').style.color = "#e74c3c";
            btnAvancar.disabled = true;
        }
    }

    function abrirConfirmacao(forma) {
        document.getElementById('modalDinheiro').style.display = "none";
        document.getElementById('formaPagamentoDisplay').innerText = forma;
        document.getElementById('modalConfirmacao').style.display = "block";
    }

    function fecharModais() { 
        document.getElementById('modalDinheiro').style.display = "none";
        document.getElementById('modalConfirmacao').style.display = "none";
        document.getElementById('modalRecibo').style.display = "none";
        if(document.getElementById('modalVendasDia')) document.getElementById('modalVendasDia').style.display = "none";
        document.getElementById('codigoVenda').focus();
    }

    function fecharReciboEVoltar() {
        fecharModais();
        cancelarVenda(); 
    }

    function finalizarVenda() {
        let total = carrinho.reduce((acc, item) => acc + (item.produto.preco * item.quantidade), 0);
        let totalItens = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
        let dataAtual = new Date();
        let dataFormatada = `${String(dataAtual.getDate()).padStart(2,'0')}/${String(dataAtual.getMonth()+1).padStart(2,'0')}/${dataAtual.getFullYear()}`;
        let horaFormatada = `${String(dataAtual.getHours()).padStart(2,'0')}:${String(dataAtual.getMinutes()).padStart(2,'0')}h`;
        
        vendas = JSON.parse(localStorage.getItem('vendas')) || [];
        let numDocumento = String(vendas.length + 1).padStart(7, '0');
        
        produtos = JSON.parse(localStorage.getItem('produtos')) || [];
        carrinho.forEach(itemVendido => {
            let prodEstoque = produtos.find(p => p.codigo === itemVendido.produto.codigo);
            if(prodEstoque) prodEstoque.quantidade = (prodEstoque.quantidade || 0) - itemVendido.quantidade;
        });
        localStorage.setItem('produtos', JSON.stringify(produtos));

        let novaVenda = { 
            documento: numDocumento, 
            data: dataFormatada, 
            hora: horaFormatada, 
            total: total, 
            itens: totalItens, 
            pagamento: formaPagamentoAtual, 
            detalhes: carrinho.map(i => ({ nome: i.produto.nome, preco: i.produto.preco, qtd: i.quantidade })) 
        };
        vendas.push(novaVenda);
        localStorage.setItem('vendas', JSON.stringify(vendas));
        
        let recibo = `<p><b>Documento N:</b> ${numDocumento} - ${dataFormatada} - ${horaFormatada}</p><hr><p><b>Itens:</b></p>`;
        carrinho.forEach(i => recibo += `<p>${i.produto.nome} - R$ ${i.produto.preco.toFixed(2)} - ${i.quantidade}x</p>`);
        recibo += `<hr><p><b>Valor total:</b> R$ ${total.toFixed(2)}<br><b>Pago através de:</b> ${formaPagamentoAtual}</p>`;
        
        document.getElementById('conteudoRecibo').innerHTML = recibo;
        document.getElementById('modalConfirmacao').style.display = "none";
        document.getElementById('modalRecibo').style.display = "block";
    }

    // --- ÚLTIMAS VENDAS (SEGUNDA VIA) ---
    function abrirVendasDoDia() {
        vendas = JSON.parse(localStorage.getItem('vendas')) || [];
        let dataAtual = new Date();
        let dataHoje = `${String(dataAtual.getDate()).padStart(2,'0')}/${String(dataAtual.getMonth()+1).padStart(2,'0')}/${dataAtual.getFullYear()}`;
        
        let listaUI = document.getElementById('listaVendasHoje');
        listaUI.innerHTML = '';
        
        let vendasHoje = vendas.filter(v => v.data === dataHoje);
        
        if (vendasHoje.length === 0) {
            listaUI.innerHTML = '<p style="text-align:center;">Nenhuma venda realizada hoje.</p>';
        } else {
            for (let i = vendasHoje.length - 1; i >= 0; i--) {
                let v = vendasHoje[i];
                let originalIndex = vendas.indexOf(v);
                listaUI.innerHTML += `
                <li style="border-bottom: 1px solid #ddd; padding: 10px 0; list-style: none;">
                    <b>Doc:</b> ${v.documento} <br>
                    <b>Horário:</b> ${v.hora || v.data} <br>
                    <b>Valor:</b> R$ ${v.total.toFixed(2)} (${v.pagamento})<br>
                    <button class="btn btn-azul" onclick="reimprimirRecibo(${originalIndex})" style="font-size: 16px; padding: 10px; margin-top: 5px; width: 100%;">🖨️ Ver Recibo (2ª Via)</button>
                </li>`;
            }
        }
        document.getElementById('modalVendasDia').style.display = "block";
    }

    function reimprimirRecibo(index) {
        let v = vendas[index];
        document.getElementById('modalVendasDia').style.display = "none";
        
        let recibo = `<p><b>Documento N:</b> ${v.documento} - ${v.data} <br><b>(2ª Via)</b></p><hr><p><b>Itens:</b></p>`;
        v.detalhes.forEach(i => recibo += `<p>${i.nome} - R$ ${i.preco.toFixed(2)} - ${i.qtd}x</p>`);
        recibo += `<hr><p><b>Valor total:</b> R$ ${v.total.toFixed(2)}<br><b>Pago através de:</b> ${v.pagamento}</p>`;
        
        document.getElementById('conteudoRecibo').innerHTML = recibo;
        document.getElementById('modalRecibo').style.display = "block";
    }
</script>

</body>
</html>
